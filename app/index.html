    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var h = new Date().getHours();
          var dark = saved === 'dark' || (!saved && (matchMedia('(prefers-color-scheme: dark)').matches || h >= 18 || h < 6));
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
